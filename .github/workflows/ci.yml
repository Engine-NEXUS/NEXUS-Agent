name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm --prefix frontend install

      - name: TypeScript check
        run: npm --prefix frontend exec tsc -- --noEmit

      - name: Build frontend
        run: npm --prefix frontend run build

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - name: Cargo check (default)
        working-directory: src-tauri
        run: cargo check

      - name: Cargo check (mock-wake)
        working-directory: src-tauri
        run: cargo check --features mock-wake

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sidecar modules parse
        working-directory: server/sidecar
        run: |
          python -c "import ast; [ast.parse(open(f).read()) for f in ['sidecar.py','tts.py','oauth.py','db.py','n8n_client.py']]; print('All modules parse OK')"

      - name: Check STT server parses
        working-directory: server
        run: python -c "import ast; ast.parse(open('stt_server.py').read()); print('STT server parses OK')"

      - name: Validate n8n blueprints
        working-directory: server/n8n
        run: |
          python -c "import json; [json.load(open(f)) for f in ['master_supervisor.blueprint.json','email_summarize.blueprint.json','github_pr_check.blueprint.json','calendar_peek.blueprint.json','general_chat.blueprint.json']]; print('All blueprints are valid JSON')"
