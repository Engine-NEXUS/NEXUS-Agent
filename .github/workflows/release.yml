name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  target: "",                              bundle: "nsis" }
          - { os: macos-14,        target: "aarch64-apple-darwin",          bundle: "dmg" }
          - { os: macos-13,        target: "x86_64-apple-darwin",           bundle: "dmg" }
          - { os: ubuntu-22.04,    target: "",                              bundle: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - name: Install frontend
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build
        env:
          # Windows signing (NSIS) — Tauri auto-signs when this is present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization — `tauri build` invokes notarytool automatically.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Build args consumed by build.ps1.
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundle }}
        shell: pwsh
        run: pwsh ./scripts/build.ps1 -Target "$env:TARGET" -Bundles "$env:BUNDLES"

      - uses: actions/upload-artifact@v4
        with:
          name: ultron-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: |
            src-tauri/target/**/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error
