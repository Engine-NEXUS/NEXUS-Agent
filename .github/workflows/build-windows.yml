name: Build Windows Executable Installer

on:
  push:
    branches: [ prem22k, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows NSIS Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Build Windows Executable (.exe) Installer via Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './src-tauri'
          args: '--features custom-protocol'

      - name: Upload Windows Setup Executable (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Windows-Installer-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
