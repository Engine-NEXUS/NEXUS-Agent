[package]
name = "nexus"
version = "0.1.0"
description = "Floating desktop AI assistant (thin client)"
authors = ["NEXUS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-positioner = "2"

tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1"
anyhow = "1"
thiserror = "1"

# Audio capture (16k mono) for wake word detection
cpal = "0.15"
# Porcupine is loaded at runtime via libloading to avoid GPL/compile-time FFI.
libloading = "0.8"
# sherpa-onnx: on-device keyword spotting + speaker verification (Apache 2.0)
# Provides KWS (wake word "NEXUS") and speaker embedding extraction (voice lock).
sherpa-onnx = "1.13.4"
# tract-onnx: pure-Rust ONNX inference (no native ONNX Runtime dependency)
# Used for openWakeWord KWS pipeline: melspectrogram → embedding → classifier
tract-onnx = "0.23"
circular-buffer = "1.2"
# Opus encoder for streaming mic to server — OPTIONAL (requires CMake on the build machine).
# The recorder streams raw 16 kHz PCM by default; enable `opus-encode` to compress upstream.
opus = { version = "0.3", optional = true }

# Secret storage for AccessKey / device token
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# WebSocket framing helpers
base64 = "0.22"

# HTTP client for local STT (faster-whisper on localhost)
reqwest = { version = "0.12", features = ["json", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Cross-platform app/URL launching (open::that, open::with)
open = "5"

# Platform-agnostic user dirs (for app_registry disk cache path)
dirs-next = "2"

# Process enumeration — check if an app is already running (3-tier resolution)
sysinfo = "0.32"
uuid = { version = "1.20.0", features = ["v4"] }

# Windows-specific: EnumWindows + SetForegroundWindow + ShellExecuteW
[target.'cfg(windows)'.dependencies]
windows = { version = "0.36", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
] }
# Registry access for App Paths + Uninstall keys (app discovery)
winreg = "0.55"
# WebView2 COM bindings for the PermissionRequested handler (auto-approve mic
# permission so the prompt never re-appears). Version pinned to match wry's.
webview2-com = "0.38"
windows-core = "0.61"

[features]
default = ["wakeword-oww"]
# REQUIRED FOR PRODUCTION BUILDS — DO NOT REMOVE.
# Tauri decides whether to load `frontendDist` (bundled assets, served over the
# custom `tauri://` protocol) or `devUrl` (http://localhost:5173) purely from
# this feature flag:
#
#   tauri-macros/src/context.rs:  dev: cfg!(not(feature = "custom-protocol"))
#
# Without it, EVERY build — including `cargo build --release` — embeds the dev
# server URL and the packaged app shows "localhost refused to connect"
# (ERR_CONNECTION_REFUSED) because no Vite server is running.
#
# `cargo tauri build` passes `--features custom-protocol` automatically.
# For a plain cargo build, pass it explicitly:
#   cargo build --release --features custom-protocol
#
# It is intentionally NOT in `default` — `tauri dev` needs it OFF so the Vite
# dev server and hot reload keep working.
custom-protocol = ["tauri/custom-protocol"]
wakeword-porcupine = []   # legacy: bundle libpv_porcupine + .ppn at runtime
wakeword-sherpa = []      # sherpa-onnx VAD + ASR + speaker verification (old)
wakeword-oww = []         # openWakeWord KWS + speaker verification (new, default)
mock-wake = []            # CI: skip native lib, emit fake wake on hotkey only
opus-encode = ["dep:opus"] # enable Opus upstream compression (needs CMake)

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
