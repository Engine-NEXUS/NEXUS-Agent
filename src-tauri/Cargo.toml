[package]
name = "ultron"
version = "0.1.0"
description = "Floating desktop AI assistant (thin client)"
authors = ["Ultron"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ultron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-positioner = "2"

tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1"
anyhow = "1"
thiserror = "1"

# Audio capture (16k mono) for Porcupine
cpal = "0.15"
# Porcupine is loaded at runtime via libloading to avoid GPL/compile-time FFI.
libloading = "0.8"
# Opus encoder for streaming mic to server — OPTIONAL (requires CMake on the build machine).
# The recorder streams raw 16 kHz PCM by default; enable `opus-encode` to compress upstream.
opus = { version = "0.3", optional = true }

# Secret storage for AccessKey / device token
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# WebSocket framing helpers
base64 = "0.22"

[features]
default = ["wakeword-porcupine"]
wakeword-porcupine = []   # bundle libpv_porcupine + .ppn at runtime
mock-wake = []            # CI: skip native lib, emit fake wake on hotkey only
opus-encode = ["dep:opus"] # enable Opus upstream compression (needs CMake)

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
